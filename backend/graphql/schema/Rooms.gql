type Room {
    _id: ID
    code: String
    name: String
    store_id: String
    type: String
    max_members: Int
    current_members: Int
    status: String
    session_name: String
    session_started_at: String
    hashtag_ids: [String]
    hashtags: [HashTag]
    created_at: String
    updated_at: String
    branch: Store
}

type Rooms {
    data: [Room]
    total: Int
}

type RoomsStats {
    total: Int
    live: Int
    private_rooms: Int
    broadcast_rooms: Int
    average_members: Float
}

type RoomActivity {
    _id: ID
    room_id: String
    room_name: String
    type: String
    title: String
    description: String
    actor_name: String
    created_at: String
}

type RoomExportFile {
    filename: String
    base64: String
}

type RoomUsageDay {
    day: String
    sessions: Int
}

type LiveRoomPreview {
    _id: ID
    name: String
    session_name: String
    current_members: Int
    session_started_at: String
}

type RoomSidePanel {
    stats: RoomsStats
    live_rooms: [LiveRoomPreview]
    activities: [RoomActivity]
}

type Query {
    Rooms(select: select): Rooms
    Rooms_stats(store_id: String): RoomsStats
    Room_activities(limit: Int, store_id: String): [RoomActivity]
    Rooms_usage_daily(days: Int): [RoomUsageDay]
    Rooms_export(select: select): RoomExportFile
    # Stats + live-rooms preview + recent activity
    Room_side_panel(store_id: String): RoomSidePanel
}

type Mutation {
    Room_create(name: String!, store_id: String, type: String, max_members: Int, status: String, hashtag_ids: [String], session_name: String): Room
    Room_update(
        _id: ID!
        name: String
        store_id: String
        type: String
        max_members: Int
        current_members: Int
        status: String
        session_name: String
        hashtag_ids: [String]
    ): Room
    Room_delete(_id: ID!): Boolean
}
